name: Release

# Runs when a GitHub release is published (tag vX.Y.Z): builds the mod zip,
# generates the SBOMs and attaches everything to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  assets:
    name: Release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Unit tests
        run: scripts/test_mod.sh
      - name: Build zip
        run: scripts/build_mod.sh "${GITHUB_REF_NAME}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/Beam-RemotePlus-Mod.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/Beam-RemotePlus-Mod.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: sha256sum Beam-RemotePlus.zip *.json > SHA256SUMS.txt
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/Beam-RemotePlus.zip \
            dist/Beam-RemotePlus-Mod.spdx.json \
            dist/Beam-RemotePlus-Mod.cdx.json \
            dist/SHA256SUMS.txt
